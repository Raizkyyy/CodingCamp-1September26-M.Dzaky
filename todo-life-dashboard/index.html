<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── Top Bar ─────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-icon">✦</span>
      <span class="brand-name">Life Dashboard</span>
    </div>
    <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
      <span class="theme-icon">🌙</span>
      <span class="theme-label">Dark</span>
    </button>
  </header>

  <!-- ── Dashboard Grid ─────────────────────────────── -->
  <main class="dashboard" role="main">

    <!-- 1 ▸ Greeting Widget -->
    <section class="card card--greeting" aria-label="Greeting and Clock">
      <div class="greeting-top">
        <div class="greeting-copy">
          <p class="greeting-phrase" id="greeting-phrase">Good Morning,</p>
          <h1 class="greeting-name" id="greeting-name">Friend</h1>
        </div>
        <div class="greeting-clock">
          <p class="clock" id="clock" aria-live="polite">00:00:00 AM</p>
          <p class="date"  id="date-display">—</p>
        </div>
      </div>
      <div class="name-row">
        <input
          id="name-input"
          type="text"
          class="input"
          placeholder="What's your name?"
          maxlength="30"
          aria-label="Enter your name"
        />
        <button id="name-save-btn" class="btn btn--accent btn--sm">Save</button>
      </div>
    </section>

    <!-- 2 ▸ Focus Timer Widget -->
    <section class="card card--timer" aria-label="Focus Timer">
      <header class="widget-header">
        <span class="widget-icon">⏱</span>
        <h2 class="widget-title">Focus Timer</h2>
      </header>
      <div class="timer-ring" role="img" aria-label="Timer">
        <svg class="ring-svg" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-bg"       cx="60" cy="60" r="52"/>
          <circle class="ring-progress" cx="60" cy="60" r="52" id="ring-progress"/>
        </svg>
        <div class="timer-inner">
          <span class="timer-display" id="timer-display">25:00</span>
          <span class="timer-label"   id="timer-label">Ready</span>
        </div>
      </div>
      <div class="timer-controls">
        <button id="timer-start" class="btn btn--accent">▶ Start</button>
        <button id="timer-pause" class="btn" disabled>⏸ Pause</button>
        <button id="timer-reset" class="btn">↺ Reset</button>
      </div>
    </section>

    <!-- 3 ▸ To-Do List Widget -->
    <section class="card card--todo" aria-label="To-Do List">
      <header class="widget-header">
        <span class="widget-icon">✅</span>
        <h2 class="widget-title">To-Do List</h2>
        <span class="todo-counter" id="todo-counter" aria-live="polite"></span>
      </header>
      <div class="input-row">
        <input
          id="todo-input"
          type="text"
          class="input"
          placeholder="Add a new task…"
          maxlength="120"
          aria-label="New task"
        />
        <button id="todo-add-btn" class="btn btn--accent">Add</button>
      </div>
      <ul id="todo-list" class="todo-list" aria-label="Task list"></ul>
      <div class="empty-state" id="todo-empty" aria-live="polite">
        <span class="empty-icon">📋</span>
        <p>No tasks yet — add your first one!</p>
      </div>
    </section>

    <!-- 4 ▸ Quick Links Widget -->
    <section class="card card--links" aria-label="Quick Links">
      <header class="widget-header">
        <span class="widget-icon">🔗</span>
        <h2 class="widget-title">Quick Links</h2>
      </header>
      <div class="link-inputs">
        <input
          id="link-name-input"
          type="text"
          class="input"
          placeholder="Link name…"
          maxlength="40"
          aria-label="Link name"
        />
        <input
          id="link-url-input"
          type="url"
          class="input"
          placeholder="https://…"
          maxlength="300"
          aria-label="Link URL"
        />
        <button id="link-add-btn" class="btn btn--accent">Add</button>
      </div>
      <div id="links-grid" class="links-grid" aria-label="Saved links"></div>
      <div class="empty-state" id="links-empty">
        <span class="empty-icon">🌐</span>
        <p>No links saved yet — add one above!</p>
      </div>
    </section>

  </main>

  <!-- Toast container (injected by JS) -->
  <div id="toast-container" class="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <script src="js/app.js"></script>
</body>
</html>
